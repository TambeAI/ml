
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ML Practicals</title>
    <style>
        body {
            margin: 20px;
            background: #ffffff;
        }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
<pre id="code">Loading practical...</pre>

<script>
    const parts = window.location.pathname.split("/");
    const id = parts[parts.length - 1];

    const githubFile =
        `https://raw.githubusercontent.com/cpp6/ML/main/${id}`;

    if (!/^\d+$/.test(id)) {
        document.getElementById("code").textContent =
            "Invalid practical number";
    } else {
        fetch(githubFile)
            .then(response => {
                if (!response.ok) {
                    throw new Error("File not found");
                }
                return response.text();
            })
            .then(code => {
                document.getElementById("code").textContent = code;
            })
            .catch(() => {
                document.getElementById("code").textContent =
                    "Practical not found";
            });
    }
</script>
</body>
</html>
